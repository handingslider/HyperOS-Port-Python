name: HyperOS Port Build

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: 'Stock ROM Download Link'
        required: true
        default: 'https://cdnorg.d.miui.com/OS3.0.5.0.WNLCNXM/duchamp-ota_full-OS3.0.5.0.WNLCNXM-user-16.0-4ec697213b.zip'
      port_url:
        description: 'Port ROM Download Link'
        required: true
        default: 'https://cdnorg.d.miui.com/OS3.0.300.4.WONCNXM/dali-ota_full-OS3.0.300.4.WONCNXM-user-16.0-86f34cc79f.zip'
      pack_type:
        description: 'Output format (super/payload)'
        required: true
        default: 'super'
      cn:
        description: 'Add Phonesky and Velvet to CN ROM builds'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd aria2
          pip install -r requirements.txt || pip install requests glob2

      - name: Prepare Binaries
        run: |
          chmod +x bin/linux/x86_64/*

      - name: Download ROMs
        run: |
          mkdir -p downloads
          echo "Downloading Stock ROM..."
          aria2c -x 16 -s 16 -d downloads -o stock.zip "${{ github.event.inputs.stock_url }}"
          echo "Downloading Port ROM..."
          aria2c -x 16 -s 16 -d downloads -o port.zip "${{ github.event.inputs.port_url }}"

      - name: Download CN GMS packages
        if: ${{ inputs.cn }}
        env:
          PHONESKY_URL: 'https://github.com/handingslider/HyperOS-Port-Python/releases/download/v1/phonesky.zip'
          VELVET_URL: 'https://github.com/handingslider/HyperOS-Port-Python/releases/download/v1/velvet.zip'
        run: |
          mkdir -p gapps
          echo "Downloading Phonesky ZIP..."
          aria2c -x 16 -s 16 -d gapps -o phonesky.zip "$PHONESKY_URL"
          echo "Downloading Velvet ZIP..."
          aria2c -x 16 -s 16 -d gapps -o velvet.zip "$VELVET_URL"

      - name: Run Porting Tool
        run: |
          python3 main.py --stock downloads/stock.zip \
                          --port downloads/port.zip \
                          --pack-type "${{ github.event.inputs.pack_type }}" \
                          ${{ inputs.cn && '--cn' || '' }} \
                          --clean

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Port-${{ github.run_id }}
          path: |
            out/*_hybrid/
          compression-level: 9
